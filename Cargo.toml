[workspace]
resolver = "2"
members = [
    "crates/craterun-core",
    "crates/craterun-bundle",
    "crates/craterun-runtime",
    "crates/craterun-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
indexmap = { version = "2", features = ["serde"] }
semver = { version = "1", features = ["serde"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
