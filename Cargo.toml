[workspace]
resolver = "2"
members = [
    "crates/craterun-core",
    "crates/craterun-bundle",
    "crates/craterun-runtime",
    "crates/craterun-supervisor",
    "crates/craterun-cli",
    "apps/shell-tauri/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
indexmap = { version = "2", features = ["serde"] }
semver = { version = "1", features = ["serde"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.8", features = ["json", "macros"] }
hyper = { version = "1", features = ["http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "client", "client-legacy", "http1", "http2"] }
tower = "0.5"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"
reqwest = { version = "0.12", features = ["json"] }
