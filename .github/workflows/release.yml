name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: bento-linux-x64
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: bento-macos-arm64
            ext: ""
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: bento-macos-x64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: bento-windows-x64
            ext: ".exe"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }} -p bento-cli

      - name: Build Supervisor
        run: cargo build --release --target ${{ matrix.target }} -p bento-supervisor

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/bento${{ matrix.ext }} dist/bento${{ matrix.ext }}
          cp target/${{ matrix.target }}/release/bento-supervisor${{ matrix.ext }} dist/bento-supervisor${{ matrix.ext }}
          cd dist
          if [ "${{ matrix.ext }}" = ".exe" ]; then
            7z a ../${{ matrix.artifact }}.zip *
          else
            tar czf ../${{ matrix.artifact }}.tar.gz *
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            bento-linux-x64.tar.gz
            bento-macos-arm64.tar.gz
            bento-macos-x64.tar.gz
            bento-windows-x64.zip
