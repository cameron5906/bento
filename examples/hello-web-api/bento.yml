app:
  id: com.example.hello-web-api
  name: Hello Web API
  version: 1.0.0
  icon: ./assets/icon.png

compose:
  file: ./docker-compose.yml
  projectName: hello-web-api

window:
  title: Hello Web API
  width: 1200
  height: 800
  entry: /

routes:
  /:
    service: web
    port: 3000
  /api:
    service: api
    port: 8080

health:
  ready:
    service: api
    path: /health
    timeoutSeconds: 120

volumes:
  db-data:
    durability: persistent
    backup: true

lifecycle:
  onWindowOpen: startServices
  onWindowClose: stopServices

install:
  mode: consumer
  askQuestions: false
