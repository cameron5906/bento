services:
  web:
    build: ./web
    ports:
      - "3000"
    depends_on:
      - api

  api:
    build: ./api
    ports:
      - "8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/app
    depends_on:
      - db

  db:
    image: postgres:16
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app

volumes:
  db-data:
