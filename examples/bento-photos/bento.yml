app:
  id: com.bento.photos
  name: Bento Photos
  version: 1.0.0
  icon: ./assets/icon.png

compose:
  file: ./docker-compose.yml
  projectName: bento-photos

window:
  title: Bento Photos
  width: 1400
  height: 900
  entry: /

routes:
  /:
    service: web
    port: 3000
  /api:
    service: api
    port: 8080

health:
  ready:
    service: api
    path: /health
    timeoutSeconds: 120

volumes:
  db-data:
    durability: persistent
    backup: true
  photo-storage:
    durability: persistent
    backup: true

lifecycle:
  onWindowOpen: startServices
  onWindowClose: stopServices

install:
  mode: consumer
  askQuestions: false

splash:
  logo: ./assets/splash-logo.png
  messages:
    - "Developing your photos..."
    - "Warming up the darkroom..."
    - "Focusing the AI lens..."
    - "Loading your memories..."
    - "Preparing the gallery..."
    - "Training the photo assistant..."
    - "Polishing the pixels..."
    - "Organizing your photo library..."
    - "Spinning up the vision engine..."
    - "Getting ready for your close-up..."
