app:
  id: com.bento.photos
  name: Bento Photos
  version: 1.0.0
  icon: ./assets/icon.png

compose:
  file: ./docker-compose.yml
  projectName: bento-photos

window:
  title: Bento Photos
  width: 1400
  height: 900
  entry: /

routes:
  /:
    service: web
    port: 3000
  /api:
    service: api
    port: 8080

health:
  ready:
    service: api
    path: /health
    timeoutSeconds: 120

volumes:
  db-data:
    durability: persistent
    backup: true
  photo-storage:
    durability: persistent
    backup: true

lifecycle:
  onWindowOpen: startServices
  onWindowClose: stopServices

install:
  mode: consumer
  askQuestions: false
