<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bento Photos</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0a0a0f; --surface: #14141f; --surface2: #1e1e2e;
  --border: #2a2a3a; --text: #e8e8f0; --text2: #8888a0;
  --accent: #6366f1; --accent2: #818cf8; --danger: #ef4444;
  --success: #22c55e; --radius: 10px;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* Header */
.header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 100; }
.header h1 { font-size: 20px; font-weight: 700; }
.header h1 span { color: var(--accent); }
.header-actions { display: flex; gap: 10px; align-items: center; }

/* Search */
.search-bar { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; color: var(--text); font-size: 14px; width: 300px; outline: none; transition: border-color 0.2s; }
.search-bar:focus { border-color: var(--accent); }
.search-bar::placeholder { color: var(--text2); }

/* Buttons */
.btn { padding: 8px 16px; border: none; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent2); }
.btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
.btn-ghost:hover { border-color: var(--text2); color: var(--text); }

/* Grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; padding: 20px 24px; }
.card { position: relative; border-radius: var(--radius); overflow: hidden; background: var(--surface); border: 1px solid var(--border); cursor: pointer; transition: transform 0.15s, border-color 0.15s; aspect-ratio: 1; }
.card:hover { transform: translateY(-2px); border-color: var(--accent); }
.card img { width: 100%; height: 100%; object-fit: cover; }
.card-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 10px; background: linear-gradient(transparent, rgba(0,0,0,0.8)); }
.card-tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag { background: rgba(99,102,241,0.3); color: var(--accent2); padding: 2px 8px; border-radius: 12px; font-size: 11px; }
.card-status { position: absolute; top: 8px; right: 8px; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
.status-pending { background: rgba(255,165,0,0.2); color: #ffa500; }
.status-analyzing { background: rgba(99,102,241,0.2); color: var(--accent2); animation: pulse 1.5s infinite; }
.status-complete { display: none; }
.status-error { background: rgba(239,68,68,0.2); color: var(--danger); }
.status-waiting_for_key { background: rgba(255,165,0,0.2); color: #ffa500; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

/* Drop zone */
.dropzone { border: 2px dashed var(--border); border-radius: var(--radius); padding: 48px; text-align: center; margin: 20px 24px; transition: all 0.2s; }
.dropzone.active { border-color: var(--accent); background: rgba(99,102,241,0.05); }
.dropzone p { color: var(--text2); font-size: 14px; }
.dropzone .icon { font-size: 48px; margin-bottom: 12px; }

/* Modal */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; display: flex; align-items: center; justify-content: center; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; max-width: 900px; width: 90%; max-height: 90vh; overflow-y: auto; display: flex; }
.modal-image { flex: 1; min-width: 0; background: #000; display: flex; align-items: center; justify-content: center; }
.modal-image img { max-width: 100%; max-height: 80vh; object-fit: contain; }
.modal-info { width: 300px; padding: 24px; border-left: 1px solid var(--border); }
.modal-info h3 { font-size: 16px; margin-bottom: 12px; }
.modal-info p { color: var(--text2); font-size: 13px; line-height: 1.6; margin-bottom: 16px; }
.modal-info .tag { margin-bottom: 4px; display: inline-block; }
.modal-close { position: absolute; top: 16px; right: 16px; background: rgba(0,0,0,0.5); border: none; color: #fff; width: 32px; height: 32px; border-radius: 50%; font-size: 18px; cursor: pointer; }

/* Settings */
.settings-panel { max-width: 500px; margin: 40px auto; padding: 32px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
.settings-panel h2 { margin-bottom: 8px; }
.settings-panel p { color: var(--text2); font-size: 13px; margin-bottom: 20px; }
.settings-panel input { width: 100%; padding: 10px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 14px; outline: none; margin-bottom: 12px; }
.settings-panel input:focus { border-color: var(--accent); }
.settings-status { font-size: 13px; padding: 8px 0; }

/* Empty state */
.empty { text-align: center; padding: 80px 24px; }
.empty h2 { font-size: 24px; margin-bottom: 8px; }
.empty p { color: var(--text2); margin-bottom: 24px; }

/* Toast */
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface2); border: 1px solid var(--border); padding: 12px 20px; border-radius: 8px; font-size: 13px; z-index: 300; animation: slideIn 0.3s; }
@keyframes slideIn { from { transform: translateY(20px); opacity: 0; } }
</style>
</head>
<body>

<div id="app"></div>

<script>
const API = '/api';
let photos = [];
let view = 'gallery'; // gallery | settings
let selectedPhoto = null;
let searchQuery = '';
let searchTimeout = null;

async function api(path, opts = {}) {
  const res = await fetch(API + path, opts);
  return res.json();
}

async function loadPhotos() {
  photos = await api('/photos');
  render();
}

async function searchPhotos(query) {
  if (!query.trim()) { await loadPhotos(); return; }
  try {
    photos = await api('/photos/search/' + encodeURIComponent(query));
    render();
  } catch (e) {
    toast('Search failed: ' + e.message);
  }
}

async function uploadFiles(files) {
  const form = new FormData();
  for (const f of files) form.append('photos', f);
  toast(`Uploading ${files.length} photo(s)...`);
  const result = await api('/photos/upload', { method: 'POST', body: form });
  toast(`${result.uploaded} photo(s) uploaded! AI analysis starting...`);
  await loadPhotos();
  // Poll for analysis completion
  startPolling();
}

let pollInterval = null;
function startPolling() {
  if (pollInterval) return;
  pollInterval = setInterval(async () => {
    const pending = photos.filter(p => p.status === 'pending' || p.status === 'analyzing');
    if (pending.length === 0) { clearInterval(pollInterval); pollInterval = null; return; }
    await loadPhotos();
  }, 3000);
}

async function saveApiKey(key) {
  await api('/settings', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key: 'openai_api_key', value: key })
  });
  toast('API key saved!');
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

function render() {
  const app = document.getElementById('app');
  if (view === 'settings') { app.innerHTML = renderSettings(); return; }
  app.innerHTML = renderHeader() + (photos.length ? renderGrid() : renderEmpty()) + (selectedPhoto ? renderModal() : '');
  bindEvents();
}

function renderHeader() {
  return `
    <div class="header">
      <h1><span>&#x1F371;</span> Bento Photos</h1>
      <div class="header-actions">
        <input class="search-bar" id="searchInput" type="text" placeholder="Search photos with AI..." value="${searchQuery}">
        <label class="btn btn-primary" style="cursor:pointer">
          + Upload
          <input type="file" id="fileInput" multiple accept="image/*" style="display:none">
        </label>
        <button class="btn btn-ghost" onclick="view='settings';render()">Settings</button>
      </div>
    </div>`;
}

function renderGrid() {
  return `<div class="grid">${photos.map(p => `
    <div class="card" onclick="openPhoto('${p.id}')">
      <img src="${API}/photos/thumb/${p.filename}" loading="lazy" alt="">
      ${p.status !== 'complete' ? `<div class="card-status status-${p.status}">${p.status === 'analyzing' ? 'Analyzing...' : p.status === 'waiting_for_key' ? 'Needs API Key' : p.status}</div>` : ''}
      ${p.tags && p.tags.length ? `<div class="card-overlay"><div class="card-tags">${p.tags.slice(0, 3).map(t => `<span class="tag">${t}</span>`).join('')}</div></div>` : ''}
    </div>`).join('')}</div>`;
}

function renderEmpty() {
  return `
    <div class="dropzone" id="dropzone">
      <div class="icon">&#x1F4F7;</div>
      <p>Drop photos here or click Upload to get started</p>
      <p style="margin-top:8px;font-size:12px;color:var(--text2)">Photos are analyzed with AI and searchable by description</p>
    </div>`;
}

function renderModal() {
  const p = selectedPhoto;
  return `
    <div class="modal-backdrop" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-image">
          <img src="${API}/photos/file/${p.filename}" alt="">
        </div>
        <div class="modal-info">
          <h3>${p.original_name || p.filename}</h3>
          ${p.description ? `<p>${p.description}</p>` : '<p style="color:var(--text2)">Waiting for AI analysis...</p>'}
          ${p.tags && p.tags.length ? `<div style="margin-bottom:16px">${p.tags.map(t => `<span class="tag">${t}</span> `).join('')}</div>` : ''}
          <div style="font-size:12px;color:var(--text2)">
            ${p.width && p.height ? `<div>${p.width} x ${p.height}</div>` : ''}
            ${p.size_bytes ? `<div>${(p.size_bytes/1048576).toFixed(1)} MB</div>` : ''}
            <div>${new Date(p.created_at).toLocaleDateString()}</div>
            <div style="margin-top:8px;padding:4px 8px;background:var(--surface2);border-radius:4px;display:inline-block">
              Status: <strong>${p.status}</strong>
            </div>
          </div>
        </div>
        <button class="modal-close" onclick="selectedPhoto=null;render()">×</button>
      </div>
    </div>`;
}

function renderSettings() {
  return `
    <div class="header">
      <h1><span>&#x1F371;</span> Bento Photos</h1>
      <div class="header-actions">
        <button class="btn btn-ghost" onclick="view='gallery';loadPhotos()">← Back to Gallery</button>
      </div>
    </div>
    <div class="settings-panel">
      <h2>OpenAI API Key</h2>
      <p>Bento Photos uses OpenAI's Vision API to analyze your photos and generate searchable descriptions. Your API key is stored locally and never leaves this machine.</p>
      <input type="password" id="apiKeyInput" placeholder="sk-..." />
      <button class="btn btn-primary" onclick="saveApiKey(document.getElementById('apiKeyInput').value)">Save API Key</button>
      <div class="settings-status" id="settingsStatus"></div>
      <div style="margin-top:24px;padding-top:16px;border-top:1px solid var(--border)">
        <h3 style="font-size:14px;margin-bottom:8px">How it works</h3>
        <ol style="font-size:13px;color:var(--text2);padding-left:20px;line-height:1.8">
          <li>Upload photos via drag-and-drop or the Upload button</li>
          <li>A background worker sends each photo to GPT-4.1 Mini for analysis</li>
          <li>AI generates a description and tags for each photo</li>
          <li>Descriptions are converted to vector embeddings for semantic search</li>
          <li>Search naturally — "sunset over water" finds matching photos</li>
        </ol>
      </div>
    </div>`;
}

async function openPhoto(id) {
  selectedPhoto = await api('/photos/' + id);
  render();
}

function closeModal(e) {
  if (e.target.classList.contains('modal-backdrop')) { selectedPhoto = null; render(); }
}

function bindEvents() {
  const fileInput = document.getElementById('fileInput');
  if (fileInput) fileInput.addEventListener('change', e => uploadFiles(e.target.files));

  const searchInput = document.getElementById('searchInput');
  if (searchInput) {
    searchInput.addEventListener('input', e => {
      searchQuery = e.target.value;
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => searchPhotos(searchQuery), 500);
    });
  }

  const dropzone = document.getElementById('dropzone');
  if (dropzone) {
    dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('active'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('active'));
    dropzone.addEventListener('drop', e => { e.preventDefault(); dropzone.classList.remove('active'); uploadFiles(e.dataTransfer.files); });
  }

  // Global drag-drop on the grid view
  document.body.addEventListener('dragover', e => e.preventDefault());
  document.body.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files.length && view === 'gallery') uploadFiles(e.dataTransfer.files); });
}

// Check settings on load
async function init() {
  const settings = await api('/settings');
  if (!settings.openai_api_key_set) {
    view = 'settings';
    render();
    toast('Please set your OpenAI API key to enable AI features');
  } else {
    await loadPhotos();
    if (photos.some(p => p.status === 'pending' || p.status === 'analyzing')) startPolling();
  }
}

init();
</script>
</body>
</html>
