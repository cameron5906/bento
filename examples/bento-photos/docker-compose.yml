services:
  web:
    build: ./web
    ports:
      - "3000"
    depends_on:
      - api

  api:
    build: ./api
    ports:
      - "8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/bentophotos
      REDIS_URL: redis://redis:6379
      PHOTO_STORAGE_PATH: /data/photos
    volumes:
      - photo-storage:/data/photos
    depends_on:
      - db
      - redis

  worker:
    build: ./worker
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/bentophotos
      REDIS_URL: redis://redis:6379
    depends_on:
      - db
      - redis

  db:
    image: pgvector/pgvector:pg17
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bentophotos

  redis:
    image: redis:7-alpine

volumes:
  db-data:
  photo-storage:
